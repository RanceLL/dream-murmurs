# main 有新提交时：如果 pictures/ 里的图片有变化，先整理成牌面（cards/）；然后把网站同步到 gh-pages
name: 整理牌面

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 看看图片有没有变
        id: chg
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "cards=1" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qE '^(pictures/|tools/build_cards\.py)'; then
            echo "cards=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.chg.outputs.cards == '1'
        with:
          python-version: '3.12'
      - name: 生成小图、大图、缩略拼图和清单
        if: steps.chg.outputs.cards == '1'
        run: |
          set -o pipefail
          pip install pillow
          python tools/build_cards.py | tee build-log.txt
          { echo '### 整理牌面'; echo '```'; cat build-log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: 提交到 main
        if: steps.chg.outputs.cards == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A cards
          if git diff --cached --quiet; then
            echo "牌面没有变化"
          else
            N=$(sed -n 's/^牌面 \([0-9][0-9]*\) 张.*/\1/p' build-log.txt | head -1)
            git commit -m "整理牌面（${N} 张）"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: 同步到 gh-pages
        run: |
          git fetch origin gh-pages || exit 0
          TREE=$(git rev-parse HEAD^{tree})
          if [ "$(git rev-parse origin/gh-pages^{tree})" != "$TREE" ]; then
            C=$(git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit-tree "$TREE" -p origin/gh-pages -m "同步网站（main $(git rev-parse --short HEAD)）")
            git push origin "$C:refs/heads/gh-pages"
          fi
